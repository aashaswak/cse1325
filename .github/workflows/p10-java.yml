name: P10 Java build

on:
  push:
    paths:
      - "P10/**"
      - ".github/workflows/p10-java.yml"
  pull_request:
    paths:
      - "P10/**"
      - ".github/workflows/p10-java.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
      - name: Compile P10
        working-directory: P10
        run: ant compile
