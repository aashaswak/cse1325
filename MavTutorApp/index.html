<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111c34"><title>MavTutor Desk</title>
<style>
:root{font-family:Inter,system-ui,"Segoe UI",sans-serif;color:#192337;background:#f4f6fa;--navy:#111c34;--blue:#3458d4;--line:#e4e8ef;--muted:#687386;--white:#fff}*{box-sizing:border-box}body{margin:0}.layout{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:var(--navy);color:white;padding:25px 16px;display:flex;flex-direction:column;gap:32px}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px}.mark{display:grid;place-items:center;width:38px;height:38px;background:#a7e5c3;color:#163c2a;border-radius:12px;font-weight:900;font-size:20px}.brand strong{display:block}.brand small{color:#b7c1d3}.nav{display:grid;gap:6px}.nav button{color:#d5ddec;background:transparent;border:0;text-align:left;padding:12px;border-radius:10px;font:inherit;cursor:pointer}.nav button:hover,.nav button.on{background:#ffffff19;color:white}.local{margin-top:auto;color:#bac6d7;font-size:12px;line-height:1.6;padding:8px}.main{padding:30px clamp(18px,4vw,56px);max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}.muted{color:var(--muted);font-size:13px}.title{font-size:27px;margin:3px 0;letter-spacing:-.5px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:white;color:#192337;border-radius:10px;padding:10px 13px;font-weight:650;cursor:pointer}.btn:hover{border-color:#b4bfd1}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.danger{color:#a52820}.btn.sm{padding:7px 9px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 8px 24px #1725420c}.metric{color:var(--muted);font-size:13px}.number{font-size:28px;font-weight:750;margin-top:7px}.split{display:grid;grid-template-columns:1.5fr .9fr;gap:16px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.head h2{margin:0;font-size:17px}.sub{color:var(--muted);font-size:12px;margin-top:5px}.empty{padding:25px 15px;text-align:center;color:var(--muted);border:1px dashed #cdd4df;border-radius:11px;font-size:13px}.upcoming{display:grid;gap:9px}.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:12px}.date{background:#eef2ff;color:#344fa7;border-radius:9px;text-align:center;padding:8px 3px}.date b{display:block;font-size:18px}.date small{font-size:10px}.item h3{margin:0 0 4px;font-size:13px}.item p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.badge{display:inline-block;padding:5px 9px;border-radius:30px;background:#e6f6ee;color:#216243;font-size:11px;font-weight:700}.badge.done{background:#e9edff;color:#394caa}.badge.cancel{background:#fce9e8;color:#a52820}.quick{display:grid;gap:9px}.quick button{text-align:left}.privacy{margin-top:15px;padding:12px;background:#eff8f2;border:1px solid #d8ecdf;border-radius:10px;color:#356248;font-size:12px;line-height:1.5}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.search{border:1px solid var(--line);border-radius:9px;padding:10px 12px;max-width:340px;width:100%}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f4;vertical-align:middle}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}tr:last-child td{border-bottom:0}.dlg{border:0;border-radius:16px;padding:0;width:min(590px,calc(100vw - 25px));box-shadow:0 25px 80px #0e18324a}.dlg::backdrop{background:#101a2dcc}.dlg form{padding:23px}.dlghead{display:flex;justify-content:space-between;margin-bottom:16px}.dlghead h2{margin:0;font-size:20px}.dlghead p{margin:5px 0;color:var(--muted);font-size:12px}.close{border:0;background:none;font-size:23px;color:var(--muted);cursor:pointer}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#475467}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid #d3d9e3;border-radius:8px;padding:10px;font:inherit}.checks{border:1px solid var(--line);border-radius:8px;padding:7px;max-height:125px;overflow:auto;display:grid;gap:3px}.checks label{display:flex;align-items:center;gap:8px;padding:4px;font-size:13px;font-weight:500}.dlgactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.footer{text-align:center;color:#98a2b3;font-size:11px;padding:24px}.toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;background:#14223d;color:white;border-radius:10px;box-shadow:0 8px 24px #17254235;font-size:13px}
@media(max-width:850px){.layout{grid-template-columns:68px 1fr}.side{padding:18px 8px}.brand{justify-content:center}.brandtext,.nav span,.local{display:none}.nav button{text-align:center;padding:12px 5px}.split{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){.layout{display:block}.side{position:sticky;top:0;z-index:5;display:flex;flex-direction:row;justify-content:space-between;padding:8px}.nav{display:flex;gap:1px}.nav button{padding:8px}.main{padding:18px 12px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.item{grid-template-columns:55px 1fr;gap:9px}.item>.badge{grid-column:2;justify-self:start}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:14px}}
</style>
</head>
<body>
<div class="layout">
<aside class="side"><div class="brand"><div class="mark">M</div><div class="brandtext"><strong>MavTutor Desk</strong><small>Peer tutoring planner</small></div></div>
<nav class="nav" aria-label="Main navigation"><button class="on" data-page="home">⌂ <span>Overview</span></button><button data-page="sessions">▦ <span>Sessions</span></button><button data-page="students">♙ <span>Students</span></button><button data-page="tutors">♧ <span>Tutors</span></button><button data-page="courses">▤ <span>Courses</span></button></nav>
<div class="local">Your organizer records stay in this browser. Export a backup to move them to another device.</div></aside>
<main class="main"><header class="top"><div><div class="muted">Peer tutoring workspace</div><h1 class="title" id="title">Overview</h1></div><div class="actions"><button class="btn" id="backup">Export backup</button><button class="btn primary" id="new-session">＋ Schedule session</button></div></header><div id="view"></div><div class="footer">MavTutor Desk · Local browser app · No account or server</div></main></div>
<dialog class="dlg" id="dialog"><form id="form"></form></dialog><input id="file" type="file" accept="application/json" hidden>
<script>
(()=>{'use strict';
const KEY='mavtutor.desk.v1', blank=()=>({courses:[],students:[],tutors:[],sessions:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||blank()}catch{db=blank()}
for(const k of Object.keys(blank()))if(!Array.isArray(db[k]))db[k]=[];
let pageName='home',filter='';
const $=s=>document.querySelector(s), view=$('#view'), dialog=$('#dialog'), form=$('#form');
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const n=document.createElement('div');n.className='toast';n.textContent=m;document.body.append(n);setTimeout(()=>n.remove(),2400)};
const course=id=>{const c=db.courses.find(x=>x.id===id);return c?c.code+' · '+c.name:'Course removed'};
const tutor=id=>db.tutors.find(x=>x.id===id)?.name||'Tutor removed';
const start=s=>new Date(s.date+'T'+s.time);
const future=()=>db.sessions.filter(s=>s.status==='Scheduled'&&start(s)>=new Date()).sort((a,b)=>start(a)-start(b));
function route(p){pageName=p;filter='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===p));$('#title').textContent=({home:'Overview',sessions:'Sessions',students:'Students',tutors:'Tutors',courses:'Courses'})[p];draw()}
function draw(){if(pageName==='home')home();else if(pageName==='sessions')sessions();else directory(pageName)}
function card(s){const day=new Date(s.date+'T00:00:00');return '<div class="item"><div class="date"><b>'+esc(day.getDate())+'</b><small>'+esc(day.toLocaleDateString(undefined,{month:'short'}))+'</small></div><div><h3>'+esc(course(s.courseId))+'</h3><p>'+esc(s.time)+' · '+esc(tutor(s.tutorId))+' · '+esc(s.location||s.format)+'<br>'+s.studentIds.length+' student'+(s.studentIds.length===1?'':'s')+'</p></div><span class="badge">'+esc(s.status)+'</span></div>'}
function home(){const next=future(),today=new Date().toISOString().slice(0,10);view.innerHTML='<section class="cards">'+[['Upcoming sessions',next.length],['Students',db.students.length],['Tutors',db.tutors.length],['Today',next.filter(s=>s.date===today).length]].map(x=>'<article class="card"><div class="metric">'+x[0]+'</div><div class="number">'+x[1]+'</div></article>').join('')+'</section><section class="split"><article class="card"><div class="head"><div><h2>Next sessions</h2><div class="sub">Your upcoming tutoring schedule</div></div><button class="btn sm" data-route="sessions">View all</button></div>'+(next.length?'<div class="upcoming">'+next.slice(0,5).map(card).join('')+'</div>':'<div class="empty">No sessions yet. Add a course, tutor, and student to start scheduling.</div>')+'</article><article class="card"><div class="head"><div><h2>Quick setup</h2><div class="sub">Build your tutoring directory</div></div></div><div class="quick"><button class="btn" data-add="courses">＋ Add a course</button><button class="btn" data-add="tutors">＋ Add a tutor</button><button class="btn" data-add="students">＋ Add a student</button><button class="btn primary" data-action="session">＋ Schedule session</button><button class="btn" data-action="import">Import backup</button></div><div class="privacy">🔒 <b>Private by default:</b> records are stored in your browser and are not uploaded to a server. Back up before clearing browser data.</div></article></section>';common()}
function sessions(){let rows=db.sessions.filter(s=>[course(s.courseId),tutor(s.tutorId),s.date,s.location,s.status].join(' ').toLowerCase().includes(filter.toLowerCase())).sort((a,b)=>start(a)-start(b));view.innerHTML='<div class="toolbar"><input class="search" id="search" placeholder="Search sessions" value="'+esc(filter)+'"><button class="btn primary" id="add">＋ Schedule session</button></div><article class="card"><div class="tablebox"><table><thead><tr><th>Date / time</th><th>Course</th><th>Tutor</th><th>Students</th><th>Location</th><th>Status</th><th></th></tr></thead><tbody>'+(rows.length?rows.map(s=>'<tr><td>'+esc(s.date)+'<br>'+esc(s.time)+' · '+s.duration+' min</td><td>'+esc(course(s.courseId))+'</td><td>'+esc(tutor(s.tutorId))+'</td><td>'+s.studentIds.map(id=>esc(db.students.find(x=>x.id===id)?.name||'Unknown')).join(', ')+'</td><td>'+esc(s.format)+(s.location?' · '+esc(s.location):'')+'</td><td><span class="badge '+(s.status==='Completed'?'done':s.status==='Cancelled'?'cancel':'')+'">'+esc(s.status)+'</span></td><td>'+(s.status==='Scheduled'?'<button class="btn sm" data-done="'+s.id+'">Complete</button> ':'')+'<button class="btn sm danger" data-del="'+s.id+'">Remove</button></td></tr>').join(''):'<tr><td colspan="7"><div class="empty">No sessions yet.</div></td></tr>')+'</tbody></table></div></article>';common();$('#add').onclick=newSession;$('#search').oninput=e=>{filter=e.target.value;sessions()};view.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{db.sessions.find(s=>s.id===b.dataset.done).status='Completed';save();draw();toast('Session marked complete')});view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove('sessions',b.dataset.del))}
const config={courses:{heading:'Courses',singular:'Course',cols:['Code','Course'],vals:x=>[x.code,x.name],fields:'<div class="field"><label>Course code</label><input name="code" placeholder="CSE 1325" maxlength="16" required></div><div class="field"><label>Course title</label><input name="name" placeholder="Object-Oriented Programming" maxlength="90" required></div>'},students:{heading:'Students',singular:'Student',cols:['Name','Email'],vals:x=>[x.name,x.email],fields:'<div class="field"><label>Name</label><input name="name" maxlength="80" required></div><div class="field"><label>Email</label><input name="email" type="email" maxlength="120" required></div>'},tutors:{heading:'Tutors',singular:'Tutor',cols:['Name','Email','Subjects'],vals:x=>[x.name,x.email,x.subjects||'—'],fields:'<div class="field"><label>Name</label><input name="name" maxlength="80" required></div><div class="field"><label>Email</label><input name="email" type="email" maxlength="120" required></div><div class="field full"><label>Subjects</label><input name="subjects" maxlength="160" placeholder="CSE, calculus"></div>'}};
function directory(k){const c=config[k],rows=db[k].filter(x=>c.vals(x).join(' ').toLowerCase().includes(filter.toLowerCase()));view.innerHTML='<div class="toolbar"><input class="search" id="search" placeholder="Search '+c.heading.toLowerCase()+'" value="'+esc(filter)+'"><button class="btn primary" id="add">＋ Add '+c.singular.toLowerCase()+'</button></div><article class="card"><div class="tablebox"><table><thead><tr>'+c.cols.map(x=>'<th>'+x+'</th>').join('')+'<th></th></tr></thead><tbody>'+(rows.length?rows.map(x=>'<tr>'+c.vals(x).map(y=>'<td>'+esc(y)+'</td>').join('')+'<td><button class="btn sm danger" data-del="'+x.id+'">Remove</button></td></tr>').join(''):'<tr><td colspan="'+(c.cols.length+1)+'"><div class="empty">No records yet.</div></td></tr>')+'</tbody></table></div></article>';common();$('#search').oninput=e=>{filter=e.target.value;directory(k)};$('#add').onclick=()=>newRecord(k);view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(k,b.dataset.del))}
function common(){view.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route));view.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>newRecord(b.dataset.add));view.querySelectorAll('[data-action=session]').forEach(b=>b.onclick=newSession);view.querySelectorAll('[data-action=import]').forEach(b=>b.onclick=()=>$('#file').click())}
function show(title,desc,fields,submit){form.innerHTML='<div class="dlghead"><div><h2>'+title+'</h2><p>'+desc+'</p></div><button class="close" type="button" aria-label="Close">×</button></div><div class="fields">'+fields+'</div><div class="dlgactions"><button class="btn cancel" type="button">Cancel</button><button class="btn primary" type="submit">Save</button></div>';form.querySelector('.close').onclick=()=>dialog.close();form.querySelector('.cancel').onclick=()=>dialog.close();form.onsubmit=e=>{e.preventDefault();submit(new FormData(form))};dialog.showModal()}
function newRecord(k){const c=config[k];show('Add '+c.singular,'This record is saved only in this browser.',c.fields,fd=>{const o={id:uid()};for(const [key,val] of fd)o[key]=String(val).trim();const dup=db[k].some(x=>k==='courses'?x.code.toLowerCase()===o.code.toLowerCase():x.email.toLowerCase()===o.email.toLowerCase());if(dup){toast('That course code or email is already listed');return}db[k].push(o);save();dialog.close();draw();toast(c.singular+' added')})}
function newSession(){if(!db.courses.length||!db.tutors.length||!db.students.length){toast('Add at least one course, tutor, and student first');return}const options=(arr,fn)=>arr.map(x=>'<option value="'+x.id+'">'+esc(fn(x))+'</option>').join('');const fields='<div class="field"><label>Course</label><select name="courseId">'+options(db.courses,x=>x.code+' · '+x.name)+'</select></div><div class="field"><label>Tutor</label><select name="tutorId">'+options(db.tutors,x=>x.name)+'</select></div><div class="field"><label>Date</label><input name="date" type="date" min="'+new Date().toISOString().slice(0,10)+'" required></div><div class="field"><label>Start time</label><input name="time" type="time" required></div><div class="field"><label>Duration</label><select name="duration"><option value="30">30 minutes</option><option value="60" selected>60 minutes</option><option value="90">90 minutes</option><option value="120">2 hours</option></select></div><div class="field"><label>Format</label><select name="format"><option>In person</option><option>Online</option></select></div><div class="field full"><label>Room or meeting link</label><input name="location" maxlength="180" placeholder="Library, room 204"></div><div class="field full"><label>Students</label><div class="checks">'+db.students.map(s=>'<label><input type="checkbox" name="studentIds" value="'+s.id+'">'+esc(s.name)+' <span class="muted">'+esc(s.email)+'</span></label>').join('')+'</div></div>';show('Schedule tutoring','Select the class, tutor, time, and students.',fields,fd=>{const chosen=fd.getAll('studentIds');if(!chosen.length){toast('Select at least one student');return}const s={id:uid(),courseId:fd.get('courseId'),tutorId:fd.get('tutorId'),date:fd.get('date'),time:fd.get('time'),duration:Number(fd.get('duration')),format:fd.get('format'),location:String(fd.get('location')).trim(),studentIds:chosen,status:'Scheduled'},a=start(s),end=+a+s.duration*60000;if(Number.isNaN(+a)){toast('Choose a valid date and time');return}const clash=db.sessions.some(x=>x.status==='Scheduled'&&x.tutorId===s.tutorId&&start(x).toDateString()===a.toDateString()&&a<new Date(+start(x)+x.duration*60000)&&new Date(end)>start(x));if(clash){toast('That tutor already has a session at this time');return}db.sessions.push(s);save();dialog.close();route('sessions');toast('Session scheduled')})}
function remove(k,id){const linked=k==='courses'?db.sessions.some(s=>s.courseId===id):k==='tutors'?db.sessions.some(s=>s.tutorId===id):k==='students'?db.sessions.some(s=>s.studentIds.includes(id)):false;if(linked){toast('Remove linked sessions first');return}if(!confirm('Remove this record?'))return;db[k]=db[k].filter(x=>x.id!==id);save();draw();toast('Record removed')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>route(b.dataset.page));$('#new-session').onclick=newSession;
$('#backup').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='mavtutor-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded')};
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!['courses','students','tutors','sessions'].every(k=>Array.isArray(v[k])))throw Error();if(confirm('Replace this browser’s records with the selected backup?')){db=v;save();draw();toast('Backup restored')}}catch{toast('That file is not a valid MavTutor backup')}finally{e.target.value=''}};
draw();
})();
</script>
</body></html>
